<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bolão SEF - Histórico</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
      :root {
        --bg: #f4f7fb;
        --card: #ffffff;
        --border: #dbe2ea;
        --text: #1f2937;
        --sub: #667085;
        --accent: #2563eb;
        --accent-2: #0f766e;
        --danger: #c2410c;
        --shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", system-ui, sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(37, 99, 235, 0.12), transparent 32%),
          radial-gradient(circle at top right, rgba(15, 118, 110, 0.1), transparent 26%),
          var(--bg);
      }

      .page {
        max-width: 1320px;
        margin: 0 auto;
        padding: 24px;
      }

      .hero {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 16px;
        flex-wrap: wrap;
      }

      .hero h1 {
        margin: 0;
        font-size: clamp(2rem, 3vw, 3rem);
        line-height: 1;
        letter-spacing: -0.04em;
      }

      .hero p {
        margin: 8px 0 0;
        max-width: 820px;
        color: var(--sub);
        font-size: 0.98rem;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        margin: 18px 0 16px;
      }

      .chart-btn,
      .play-btn {
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.92);
        color: var(--text);
        border-radius: 999px;
        padding: 10px 16px;
        font-size: 0.92rem;
        font-weight: 700;
        cursor: pointer;
        transition:
          transform 0.12s ease,
          background 0.12s ease,
          border-color 0.12s ease,
          color 0.12s ease;
        box-shadow: 0 4px 16px rgba(15, 23, 42, 0.04);
      }

      .chart-btn:hover,
      .play-btn:hover {
        transform: translateY(-1px);
        border-color: rgba(37, 99, 235, 0.35);
      }

      .chart-btn.active {
        background: linear-gradient(135deg, var(--accent), #1d4ed8);
        color: #fff;
        border-color: transparent;
      }

      .chart-card {
        background: var(--card);
        border: 1px solid rgba(219, 226, 234, 0.9);
        border-radius: 24px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .chart-head {
        padding: 18px 20px 14px;
        border-bottom: 1px solid rgba(219, 226, 234, 0.75);
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        align-items: center;
        justify-content: space-between;
      }

      .chart-title {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .chart-legend {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 6px 20px 14px;
      }

      .chart-legend-item {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 6px 10px;
        background: #fff;
        color: var(--text);
        font-size: 0.82rem;
        font-weight: 700;
        cursor: pointer;
        user-select: none;
        transition: opacity 0.12s ease, transform 0.12s ease, background 0.12s ease;
      }

      .chart-legend-item:hover {
        transform: translateY(-1px);
      }

      .chart-legend-item.inactive {
        opacity: 0.35;
      }

      .chart-legend-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex-shrink: 0;
      }

      #chart-title {
        font-size: 1.05rem;
        font-weight: 800;
        margin: 0;
      }

      #chart-subtitle {
        margin: 0;
        color: var(--sub);
        font-size: 0.92rem;
      }

      .race-controls {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .reference-controls {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        position: relative;
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 8px 10px;
        box-shadow: 0 4px 16px rgba(15, 23, 42, 0.04);
      }

      .reference-label {
        font-size: 0.78rem;
        font-weight: 800;
        color: var(--sub);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .reference-select {
        min-width: 220px;
        max-width: 260px;
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 8px 12px;
        background: rgba(255, 255, 255, 0.92);
        color: var(--text);
        font-weight: 700;
        font-size: 0.9rem;
        box-shadow: 0 4px 16px rgba(15, 23, 42, 0.04);
        display: inline-flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        cursor: pointer;
      }

      .reference-menu {
        position: absolute;
        top: calc(100% + 8px);
        right: 0;
        min-width: 320px;
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 14px;
        box-shadow: var(--shadow);
        z-index: 240;
        padding: 10px;
        display: none;
      }

      .reference-menu.open {
        display: block;
      }

      .reference-filter {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 10px;
        outline: none;
        background: #fff;
        color: var(--text);
        font-size: 0.88rem;
        padding: 8px 10px;
        margin-bottom: 8px;
      }

      .reference-options {
        max-height: 240px;
        overflow: auto;
        border: 1px solid var(--border);
        border-radius: 10px;
      }

      .reference-option {
        width: 100%;
        border: 0;
        border-bottom: 1px solid var(--border);
        background: #fff;
        text-align: left;
        padding: 8px 10px;
        color: var(--text);
        font-size: 0.86rem;
        cursor: pointer;
      }

      .reference-option:last-child {
        border-bottom: 0;
      }

      .reference-option:hover {
        background: #eff6ff;
      }

      .reference-option.active {
        font-weight: 800;
        color: var(--accent);
      }

      .reference-empty {
        padding: 9px 10px;
        color: var(--sub);
        font-size: 0.84rem;
      }

      #date-display {
        font-size: 1.2rem;
        font-weight: 800;
        color: var(--danger);
        letter-spacing: -0.02em;
      }

      #chart-container {
        width: 100%;
        height: 640px;
      }

      .hidden {
        display: none !important;
      }

      .btn-img {
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.07);
        border: none;
        color: var(--sub);
        padding: 5px 6px;
        border-radius: 6px;
        cursor: pointer;
        flex-shrink: 0;
        transition: background 0.15s, color 0.15s;
      }

      .btn-img:hover {
        background: var(--accent);
        color: #fff;
      }

      @media (max-width: 768px) {
        .page {
          padding: 16px;
        }

        .chart-head {
          align-items: flex-start;
        }

        #chart-container {
          height: 540px;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="hero">
        <div>
          <h1>Bolão SEF</h1>
          <p>
            Visualização histórica da disputa.
          </p>
        </div>
      </div>

      <div class="toolbar" id="chart-type-toolbar">
        <button class="chart-btn active" data-type="positions">
          Histórico de posições
        </button>
        <button class="chart-btn" data-type="points-leader">
          Pontuação relativa
        </button>
        <button class="chart-btn" data-type="race">Gráfico de barras</button>
      </div>

      <div class="chart-card" id="ranking-card">
        <div class="chart-head">
          <div class="chart-title">
            <h2 id="chart-title">Histórico de posições</h2>
            <p id="chart-subtitle">
              Linha temporal da colocação de cada participante ao longo dos
              dias.
            </p>
          </div>

          <div class="race-controls hidden" id="race-controls">
            <button class="play-btn" id="play-btn">Play</button>
            <div id="date-display">Aguardando...</div>
          </div>
          <div class="reference-controls hidden" id="reference-controls">
            <span class="reference-label">Referência</span>
            <button class="reference-select" id="reference-picker-btn" type="button">
              <span id="reference-picker-label">Líder do dia</span>
              <span aria-hidden="true">▾</span>
            </button>
            <div class="reference-menu" id="reference-menu">
              <input
                class="reference-filter"
                id="reference-filter"
                type="text"
                placeholder="Filtrar nome"
                autocomplete="off"
              />
              <div class="reference-options" id="reference-options"></div>
            </div>
          </div>

          <button class="btn-img" onclick="exportImage()" title="Salvar imagem">
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
            >
              <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4" />
              <polyline points="7,10 12,15 17,10" />
              <line x1="12" y1="15" x2="12" y2="3" />
            </svg>
          </button>
        </div>
        <div class="chart-legend hidden" id="chart-legend"></div>
        <div id="chart-container"></div>
      </div>
    </div>

    <script src="js/charts/positions-chart.js"></script>
    <script src="js/charts/points-leader-chart.js"></script>
    <script src="js/charts/race-chart.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
