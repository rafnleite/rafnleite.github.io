<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolão SEF - Histórico</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
            :root {
                --bg: #f4f7fb;
                --card: #ffffff;
                --border: #dbe2ea;
                --text: #1f2937;
                --sub: #667085;
                --accent: #2563eb;
                --accent-2: #0f766e;
                --danger: #c2410c;
                --shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                font-family: "Segoe UI", system-ui, sans-serif;
                color: var(--text);
                background:
                    radial-gradient(circle at top left, rgba(37, 99, 235, 0.12), transparent 32%),
                    radial-gradient(circle at top right, rgba(15, 118, 110, 0.10), transparent 26%),
                    var(--bg);
            }

            .page {
                max-width: 1320px;
                margin: 0 auto;
                padding: 24px;
            }

            .hero {
                display: flex;
                align-items: flex-end;
                justify-content: space-between;
                gap: 16px;
                margin-bottom: 16px;
                flex-wrap: wrap;
            }

            .hero h1 {
                margin: 0;
                font-size: clamp(2rem, 3vw, 3rem);
                line-height: 1;
                letter-spacing: -0.04em;
            }

            .hero p {
                margin: 8px 0 0;
                max-width: 820px;
                color: var(--sub);
                font-size: 0.98rem;
            }

            .toolbar {
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
                margin: 18px 0 16px;
            }

            .chart-btn,
            .play-btn {
                border: 1px solid var(--border);
                background: rgba(255, 255, 255, 0.92);
                color: var(--text);
                border-radius: 999px;
                padding: 10px 16px;
                font-size: 0.92rem;
                font-weight: 700;
                cursor: pointer;
                transition: transform .12s ease, background .12s ease, border-color .12s ease, color .12s ease;
                box-shadow: 0 4px 16px rgba(15, 23, 42, 0.04);
            }

            .chart-btn:hover,
            .play-btn:hover {
                transform: translateY(-1px);
                border-color: rgba(37, 99, 235, 0.35);
            }

            .chart-btn.active {
                background: linear-gradient(135deg, var(--accent), #1d4ed8);
                color: #fff;
                border-color: transparent;
            }

            .chart-card {
                background: var(--card);
                border: 1px solid rgba(219, 226, 234, 0.9);
                border-radius: 24px;
                box-shadow: var(--shadow);
                overflow: hidden;
            }

            .chart-head {
                padding: 18px 20px 14px;
                border-bottom: 1px solid rgba(219, 226, 234, 0.75);
                display: flex;
                flex-wrap: wrap;
                gap: 14px;
                align-items: center;
                justify-content: space-between;
            }

            .chart-title {
                display: flex;
                flex-direction: column;
                gap: 4px;
            }

            #chart-title {
                font-size: 1.05rem;
                font-weight: 800;
                margin: 0;
            }

            #chart-subtitle {
                margin: 0;
                color: var(--sub);
                font-size: 0.92rem;
            }

            .race-controls {
                display: flex;
                align-items: center;
                gap: 10px;
                flex-wrap: wrap;
            }

            #date-display {
                font-size: 1.2rem;
                font-weight: 800;
                color: var(--danger);
                letter-spacing: -0.02em;
            }

            #chart-container {
                width: 100%;
                height: 640px;
            }

            .hidden {
                display: none !important;
            }

            @media (max-width: 768px) {
                .page {
                    padding: 16px;
                }

                .chart-head {
                    align-items: flex-start;
                }

                #chart-container {
                    height: 540px;
                }
            }
        </style>
    <div class="controls">
        <button id="play-btn">Play</button>
    </div>
    <div id="date-display">Aguardando...</div>
    <div id="chart-container"></div>

    <script>
        const chartDom = document.getElementById('chart-container');
        const myChart = echarts.init(chartDom);
        const dateDisplay = document.getElementById('date-display');
        const playBtn = document.getElementById('play-btn');

        const monthNames = ["Jan", "Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set", "Out", "Nov", "Dez"];
        const colors = ['#5470c6', '#91cc75', '#fac858', '#ee6666', '#73c0de', '#3ba272', '#fc8452', '#9a60b4'];

        let formattedDates = [];
        let participantsData = [];
        let currentIndex = 0;
        let timer = null;
        const transitionDuration = 1600;
        const dayPause = 500;
        const maxVisibleBars = 30;
        const visibleValueLabels = 44;
        const minChartHeight = 600;
        const pixelsPerParticipant = 28;

        function parseCsvData(csvText) {
            const lines = csvText
                .split(/\r?\n/)
                .map(line => line.trim())
                .filter(Boolean);

            if (!lines.length) {
                throw new Error('CSV vazio.');
            }

            const headers = lines[0].split(';').map(h => h.trim());
            const participantIndex = headers.indexOf('Participante');
            const dateColumnIndexes = headers
                .map((h, idx) => ({ header: h, idx }))
                .filter(({ header }) => /^\d{4}-\d{2}-\d{2}$/.test(header));

            if (participantIndex < 0 || !dateColumnIndexes.length) {
                throw new Error('CSV sem colunas esperadas (Participante e datas).');
            }

            formattedDates = dateColumnIndexes.map(({ header }) => {
                const [, month, day] = header.split('-');
                return `${day}/${monthNames[parseInt(month, 10) - 1]}`;
            });

            participantsData = lines.slice(1).map((line, index) => {
                const parts = line.split(';');
                const name = (parts[participantIndex] || '').trim();
                let cumulative = 0;
                const cumulativeScores = dateColumnIndexes.map(({ idx }) => {
                    const value = parseInt((parts[idx] || '0').trim(), 10);
                    cumulative += Number.isNaN(value) ? 0 : value;
                    return cumulative;
                });

                return {
                    name,
                    scores: cumulativeScores,
                    order: index,
                    color: colors[index % colors.length]
                };
            }).filter(p => p.name.length > 0);
        }

        function updateChart(index, animate = true) {
            const dataForDate = participantsData.map(p => ({
                value: [
                    (p.scores[index] || 0) + (p.order * 0.000001),
                    p.name
                ],
                itemStyle: { color: p.color }
            }));

            myChart.setOption({
                series: [{
                    data: dataForDate
                }],
                animationDuration: animate ? transitionDuration : 0,
                animationDurationUpdate: animate ? transitionDuration : 0
            }, false, true);

            dateDisplay.innerText = formattedDates[index];
        }

        function resizeChartForParticipants() {
            const targetHeight = Math.max(minChartHeight, participantsData.length * pixelsPerParticipant);
            chartDom.style.height = `${targetHeight}px`;
            myChart.resize();
        }

        const option = {
            grid: { top: 40, bottom: 30, left: 300, right: 100 },
            xAxis: {
                type: 'value',
                max: 'dataMax',
                splitLine: { show: true }
            },
            yAxis: {
                type: 'category',
                inverse: true,
                max: maxVisibleBars - 1,
                axisLabel: {
                    show: true,
                    fontSize: 14,
                    fontWeight: 'bold',
                    margin: 20,
                    width: 250,
                    overflow: 'truncate'
                },
                axisTick: { show: false },
                axisLine: { show: false },
                animationDuration: 300,
                animationDurationUpdate: 300
            },
            series: [{
                realtimeSort: true,
                type: 'bar',
                encode: { x: 0, y: 1 },
                barMaxWidth: 38,
                label: {
                    show: true,
                    position: 'right',
                    valueAnimation: false,
                    fontFamily: 'monospace',
                    fontSize: 15,
                    fontWeight: 'bold',
                    formatter: (param) => param.dataIndex < visibleValueLabels ? Math.round(param.value[0]) : ''
                }
            }],
            animationDuration: transitionDuration,
            animationDurationUpdate: transitionDuration,
            animationEasing: 'linear',
            animationEasingUpdate: 'linear'
        };

        myChart.setOption(option);

        function play() {
            if (currentIndex >= formattedDates.length - 1) {
                currentIndex = 0;
                myChart.setOption({
                    animationDuration: 0,
                    animationDurationUpdate: 0,
                    yAxis: {
                        animationDuration: 0,
                        animationDurationUpdate: 0
                    }
                });
                updateChart(currentIndex, false);

                setTimeout(() => {
                    myChart.setOption({
                        animationDuration: transitionDuration,
                        animationDurationUpdate: transitionDuration,
                        yAxis: {
                            animationDuration: 300,
                            animationDurationUpdate: 300
                        }
                    });
                    startTimer();
                }, 100);
            } else {
                startTimer();
            }
            playBtn.innerText = 'Pause';
        }

        function stop() {
            clearTimeout(timer);
            timer = null;
            playBtn.innerText = 'Play';
        }

        function startTimer() {
            if (timer) return;
            const advanceDay = () => {
                if (!timer) return;

                currentIndex++;
                if (currentIndex >= formattedDates.length) {
                    stop();
                } else {
                    updateChart(currentIndex, true);
                    timer = setTimeout(advanceDay, transitionDuration + dayPause);
                }
            };

            timer = setTimeout(advanceDay, 0);
        }

        playBtn.addEventListener('click', () => {
            timer ? stop() : play();
        });

        async function init() {
            try {
                const response = await fetch('pontuacao-por-dia-grupo-3484.csv');
                if (!response.ok) {
                    throw new Error(`Falha ao carregar CSV (${response.status}).`);
                }

                const csvText = await response.text();
                parseCsvData(csvText);

                if (!participantsData.length || !formattedDates.length) {
                    throw new Error('CSV sem dados válidos para exibição.');
                }

                resizeChartForParticipants();
                updateChart(0, false);
                dateDisplay.innerText = formattedDates[0];
            } catch (error) {
                dateDisplay.innerText = 'Erro ao carregar CSV';
                playBtn.disabled = true;
                playBtn.innerText = 'Indisponível';
                console.error(error);
            }
        }

        init();
        window.addEventListener('resize', () => myChart.resize());
    </script>
</body>
</html>
