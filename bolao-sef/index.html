<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bolão SEF - Histórico</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
      :root {
        --bg: #f4f7fb;
        --card: #ffffff;
        --border: #dbe2ea;
        --text: #1f2937;
        --sub: #667085;
        --accent: #2563eb;
        --accent-2: #0f766e;
        --danger: #c2410c;
        --shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", system-ui, sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(37, 99, 235, 0.12), transparent 32%),
          radial-gradient(circle at top right, rgba(15, 118, 110, 0.1), transparent 26%),
          var(--bg);
      }

      .page {
        max-width: 1320px;
        margin: 0 auto;
        padding: 24px;
      }

      .hero {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 16px;
        flex-wrap: wrap;
      }

      .hero h1 {
        margin: 0;
        font-size: clamp(2rem, 3vw, 3rem);
        line-height: 1;
        letter-spacing: -0.04em;
      }

      .hero p {
        margin: 8px 0 0;
        max-width: 820px;
        color: var(--sub);
        font-size: 0.98rem;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        margin: 18px 0 16px;
      }

      .chart-btn,
      .play-btn {
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.92);
        color: var(--text);
        border-radius: 999px;
        padding: 10px 16px;
        font-size: 0.92rem;
        font-weight: 700;
        cursor: pointer;
        transition:
          transform 0.12s ease,
          background 0.12s ease,
          border-color 0.12s ease,
          color 0.12s ease;
        box-shadow: 0 4px 16px rgba(15, 23, 42, 0.04);
      }

      .chart-btn:hover,
      .play-btn:hover {
        transform: translateY(-1px);
        border-color: rgba(37, 99, 235, 0.35);
      }

      .chart-btn.active {
        background: linear-gradient(135deg, var(--accent), #1d4ed8);
        color: #fff;
        border-color: transparent;
      }

      .chart-card {
        background: var(--card);
        border: 1px solid rgba(219, 226, 234, 0.9);
        border-radius: 24px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .chart-head {
        padding: 18px 20px 14px;
        border-bottom: 1px solid rgba(219, 226, 234, 0.75);
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        align-items: center;
        justify-content: space-between;
      }

      .chart-title {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .chart-legend {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 0 20px 14px;
      }

      .chart-legend-item {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 6px 10px;
        background: #fff;
        color: var(--text);
        font-size: 0.82rem;
        font-weight: 700;
        cursor: pointer;
        user-select: none;
        transition: opacity 0.12s ease, transform 0.12s ease, background 0.12s ease;
      }

      .chart-legend-item:hover {
        transform: translateY(-1px);
      }

      .chart-legend-item.inactive {
        opacity: 0.35;
      }

      .chart-legend-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex-shrink: 0;
      }

      #chart-title {
        font-size: 1.05rem;
        font-weight: 800;
        margin: 0;
      }

      #chart-subtitle {
        margin: 0;
        color: var(--sub);
        font-size: 0.92rem;
      }

      .race-controls {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .reference-controls {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        position: relative;
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 8px 10px;
        box-shadow: 0 4px 16px rgba(15, 23, 42, 0.04);
      }

      .reference-label {
        font-size: 0.78rem;
        font-weight: 800;
        color: var(--sub);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .reference-select {
        min-width: 220px;
        max-width: 260px;
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 8px 12px;
        background: rgba(255, 255, 255, 0.92);
        color: var(--text);
        font-weight: 700;
        font-size: 0.9rem;
        box-shadow: 0 4px 16px rgba(15, 23, 42, 0.04);
        display: inline-flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        cursor: pointer;
      }

      .reference-menu {
        position: absolute;
        top: calc(100% + 8px);
        right: 0;
        min-width: 320px;
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 14px;
        box-shadow: var(--shadow);
        z-index: 240;
        padding: 10px;
        display: none;
      }

      .reference-menu.open {
        display: block;
      }

      .reference-filter {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 10px;
        outline: none;
        background: #fff;
        color: var(--text);
        font-size: 0.88rem;
        padding: 8px 10px;
        margin-bottom: 8px;
      }

      .reference-options {
        max-height: 240px;
        overflow: auto;
        border: 1px solid var(--border);
        border-radius: 10px;
      }

      .reference-option {
        width: 100%;
        border: 0;
        border-bottom: 1px solid var(--border);
        background: #fff;
        text-align: left;
        padding: 8px 10px;
        color: var(--text);
        font-size: 0.86rem;
        cursor: pointer;
      }

      .reference-option:last-child {
        border-bottom: 0;
      }

      .reference-option:hover {
        background: #eff6ff;
      }

      .reference-option.active {
        font-weight: 800;
        color: var(--accent);
      }

      .reference-empty {
        padding: 9px 10px;
        color: var(--sub);
        font-size: 0.84rem;
      }

      #date-display {
        font-size: 1.2rem;
        font-weight: 800;
        color: var(--danger);
        letter-spacing: -0.02em;
      }

      #chart-container {
        width: 100%;
        height: 640px;
      }

      .hidden {
        display: none !important;
      }

      @media (max-width: 768px) {
        .page {
          padding: 16px;
        }

        .chart-head {
          align-items: flex-start;
        }

        #chart-container {
          height: 540px;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="hero">
        <div>
          <h1>Bolão SEF</h1>
          <p>
            Visualização histórica da disputa, com leitura por posições e por
            pontos em relação ao líder, no mesmo espírito do ranking do e-bets.
          </p>
        </div>
      </div>

      <div class="toolbar" id="chart-type-toolbar">
        <button class="chart-btn active" data-type="positions">
          Histórico de posições
        </button>
        <button class="chart-btn" data-type="points-leader">
          Pontuação relativa
        </button>
        <button class="chart-btn" data-type="race">Gráfico de barras</button>
      </div>

      <div class="chart-card">
        <div class="chart-head">
          <div class="chart-title">
            <h2 id="chart-title">Histórico de posições</h2>
            <p id="chart-subtitle">
              Linha temporal da colocação de cada participante ao longo dos
              dias.
            </p>
          </div>

          <div class="race-controls hidden" id="race-controls">
            <button class="play-btn" id="play-btn">Play</button>
            <div id="date-display">Aguardando...</div>
          </div>
          <div class="reference-controls hidden" id="reference-controls">
            <span class="reference-label">Referência</span>
            <button class="reference-select" id="reference-picker-btn" type="button">
              <span id="reference-picker-label">Líder do dia</span>
              <span aria-hidden="true">▾</span>
            </button>
            <div class="reference-menu" id="reference-menu">
              <input
                class="reference-filter"
                id="reference-filter"
                type="text"
                placeholder="Filtrar nome"
                autocomplete="off"
              />
              <div class="reference-options" id="reference-options"></div>
            </div>
          </div>
        </div>
        <div class="chart-legend hidden" id="chart-legend"></div>
        <div id="chart-container"></div>
      </div>
    </div>

    <script>
      const chartDom = document.getElementById("chart-container");
      const dateDisplay = document.getElementById("date-display");
      const playBtn = document.getElementById("play-btn");
      const raceControls = document.getElementById("race-controls");
      const referenceControls = document.getElementById("reference-controls");
      const referencePickerBtn = document.getElementById("reference-picker-btn");
      const referencePickerLabel = document.getElementById("reference-picker-label");
      const referenceMenu = document.getElementById("reference-menu");
      const referenceFilter = document.getElementById("reference-filter");
      const referenceOptions = document.getElementById("reference-options");
      const chartTitle = document.getElementById("chart-title");
      const chartSubtitle = document.getElementById("chart-subtitle");
      const chartButtons = Array.from(document.querySelectorAll(".chart-btn"));

      const monthNames = [
        "Jan",
        "Fev",
        "Mar",
        "Abr",
        "Mai",
        "Jun",
        "Jul",
        "Ago",
        "Set",
        "Out",
        "Nov",
        "Dez",
      ];
      const colors = [
        "#2563eb",
        "#dc2626",
        "#16a34a",
        "#ca8a04",
        "#9333ea",
        "#ea580c",
        "#0891b2",
        "#db2777",
        "#84cc16",
        "#0284c7",
      ];

      const transitionDuration = 1400;
      const dayPause = 500;
      const raceUpdateFrequency = 2000;
      const raceAxisAnimationDuration = 300;
      const minChartHeight = 640;
      const pixelsPerParticipant = 28;
      const minRaceChartHeight = 900;
      const racePixelsPerParticipant = 42;

      let chartType = "positions";
      let chart = null;
      let timer = null;
      let currentIndex = 0;
      let formattedDates = [];
      let participantsData = [];
      let participantOrder = {};
      let snapshots = [];
      let sortedNames = [];
      let colorMap = {};
      let raceCurrentSorted = [];
      let seriesSelection = {};
      let referencePlayer = "";
      let referenceFilterText = "";

      function initChart() {
        if (!chart) {
          chart = echarts.init(chartDom, null, { renderer: "canvas" });
        }
        return chart;
      }

      function destroyChart() {
        stopRace();
        if (chart) {
          chart.dispose();
          chart = null;
        }
      }

      function resizeChartForParticipants(isRace) {
        chartDom.style.height = isRace
          ? `${Math.max(minRaceChartHeight, participantsData.length * racePixelsPerParticipant)}px`
          : "640px";

        if (chart) {
          chart.resize();
        }
      }

      function ensureSeriesSelection(names) {
        names.forEach((name) => {
          if (typeof seriesSelection[name] === "undefined") {
            seriesSelection[name] = true;
          }
        });
      }

      function isSeriesVisible(name) {
        return seriesSelection[name] !== false;
      }

      function toggleSeriesVisibility(name) {
        seriesSelection[name] = !isSeriesVisible(name);
        renderChart();
      }

      function getVisibleSeriesNames() {
        return sortedNames.filter((name) => isSeriesVisible(name));
      }

      function getSelectedReferenceName() {
        if (referencePlayer && sortedNames.includes(referencePlayer)) {
          return referencePlayer;
        }
        return "";
      }

      function getFilteredReferenceNames() {
        const filter = (referenceFilterText || "").trim().toLowerCase();
        if (!filter) return sortedNames.slice();
        return sortedNames.filter((name) => name.toLowerCase().includes(filter));
      }

      function syncReferenceOptions() {
        if (!referencePickerLabel || !referenceFilter || !referenceOptions) return;

        const current = referencePlayer && sortedNames.includes(referencePlayer) ? referencePlayer : "";
        const filteredNames = getFilteredReferenceNames();

        referenceFilter.value = referenceFilterText;
        referencePickerLabel.textContent = current || "Líder do dia";

        referenceOptions.innerHTML =
          `<button type="button" class="reference-option${current === "" ? " active" : ""}" data-value="">Líder do dia</button>` +
          (filteredNames.length
            ? filteredNames
                .map((name) => {
                  const safe = name
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/\"/g, "&quot;");
                  return `<button type="button" class="reference-option${name === current ? " active" : ""}" data-value="${safe}">${safe}</button>`;
                })
                .join("")
            : `<div class="reference-empty">Nenhum apostador encontrado para o filtro.</div>`);

        referenceOptions.querySelectorAll(".reference-option").forEach((button) => {
          button.addEventListener("click", () => {
            referencePlayer = button.dataset.value || "";
            if (referenceMenu) referenceMenu.classList.remove("open");
            setChartMeta(chartType);
            renderChart();
          });
        });
      }

      function getPositionAxisMax() {
        const visibleNames = getVisibleSeriesNames();
        let maxValue = 1;

        if (!visibleNames.length) return 1;

        snapshots.forEach((snapshot) => {
          visibleNames.forEach((name) => {
            const position = snapshot.posMap[name] || 1;
            if (position > maxValue) maxValue = position;
          });
        });

        return maxValue;
      }

      function getRelativeAxisRange(referenceName) {
        const visibleNames = getVisibleSeriesNames();
        const refName = referenceName || getSelectedReferenceName();
        let minValue = 0;
        let maxValue = 0;

        snapshots.forEach((snapshot) => {
          const referenceValue = refName
            ? snapshot.ptsMap[refName] || 0
            : snapshot.leader || 0;
          visibleNames.forEach((name) => {
            const relative = (snapshot.ptsMap[name] || 0) - referenceValue;
            if (relative < minValue) minValue = relative;
            if (relative > maxValue) maxValue = relative;
          });
        });

        return { min: minValue, max: maxValue };
      }

      function updateReferenceUI() {
        if (!referenceControls || !referencePickerBtn) return;

        if (chartType === "points-leader") {
          referenceControls.classList.remove("hidden");
          syncReferenceOptions();
        } else {
          referenceControls.classList.add("hidden");
          if (referenceMenu) referenceMenu.classList.remove("open");
        }
      }

      function parseCsvData(csvText) {
        const lines = csvText
          .split(/\r?\n/)
          .map((line) => line.trim())
          .filter(Boolean);

        if (!lines.length) {
          throw new Error("CSV vazio.");
        }

        const headers = lines[0].split(";").map((h) => h.trim());
        const participantIndex = headers.indexOf("Participante");
        const dateColumns = headers
          .map((header, idx) => ({ header, idx }))
          .filter(({ header }) => /^\d{4}-\d{2}-\d{2}$/.test(header));

        if (participantIndex < 0 || !dateColumns.length) {
          throw new Error("CSV sem colunas esperadas (Participante e datas).");
        }

        formattedDates = dateColumns.map(({ header }) => {
          const [, month, day] = header.split("-");
          return `${day}/${monthNames[parseInt(month, 10) - 1]}`;
        });

        participantsData = lines
          .slice(1)
          .map((line, index) => {
            const parts = line.split(";");
            const name = (parts[participantIndex] || "").trim();
            let cumulative = 0;

            const scores = dateColumns.map(({ idx }) => {
              const value = parseInt((parts[idx] || "0").trim(), 10);
              cumulative += Number.isNaN(value) ? 0 : value;
              return cumulative;
            });

            participantOrder[name] = index;

            return {
              name,
              scores,
              order: index,
              color: colors[index % colors.length],
            };
          })
          .filter((participant) => participant.name.length > 0);

        buildSnapshots();
      }

      function buildSnapshots() {
        snapshots = formattedDates.map((_, dateIndex) => {
          const ptsMap = {};

          participantsData.forEach((participant) => {
            ptsMap[participant.name] = participant.scores[dateIndex] || 0;
          });

          const entries = participantsData
            .map((participant) => ({
              name: participant.name,
              pts: ptsMap[participant.name] || 0,
              order: participant.order,
            }))
            .sort((a, b) => {
              if (b.pts !== a.pts) return b.pts - a.pts;
              return a.order - b.order;
            });

          const posMap = {};
          let rank = 1;

          entries.forEach((entry, idx) => {
            if (idx > 0) {
              const prev = entries[idx - 1];
              if (entry.pts !== prev.pts) {
                rank = idx + 1;
              }
            }

            posMap[entry.name] = rank;
          });

          return {
            ptsMap,
            posMap,
            leader: entries.length ? entries[0].pts : 0,
          };
        });

        const lastSnapshot = snapshots[snapshots.length - 1];
        sortedNames = participantsData
          .map((participant) => participant.name)
          .sort((a, b) => {
            const posA = lastSnapshot
              ? lastSnapshot.posMap[a] || participantsData.length + 1
              : participantsData.length + 1;
            const posB = lastSnapshot
              ? lastSnapshot.posMap[b] || participantsData.length + 1
              : participantsData.length + 1;
            if (posA !== posB) return posA - posB;
            return (participantOrder[a] || 0) - (participantOrder[b] || 0);
          });

        colorMap = {};
        sortedNames.forEach((name, index) => {
          colorMap[name] = colors[index % colors.length];
        });

        ensureSeriesSelection(sortedNames);
        if (referencePlayer && !sortedNames.includes(referencePlayer)) {
          referencePlayer = "";
        }
        syncReferenceOptions();
      }

      function syncLegend() {
        const legendEl = document.getElementById("chart-legend");
        if (!legendEl) return;

        if (chartType === "race") {
          legendEl.classList.add("hidden");
          legendEl.innerHTML = "";
          return;
        }

        legendEl.classList.remove("hidden");
        legendEl.innerHTML = sortedNames
          .map((name) => {
            const active = isSeriesVisible(name);
            return `
              <button type="button" class="chart-legend-item ${active ? "" : "inactive"}" data-name="${name}">
                <span class="chart-legend-dot" style="background:${colorMap[name]}"></span>
                <span>${name}</span>
              </button>
            `;
          })
          .join("");

        legendEl.querySelectorAll(".chart-legend-item").forEach((item) => {
          item.addEventListener("click", () => {
            toggleSeriesVisibility(item.dataset.name);
          });
        });
      }

      function renderPositionsChart() {
        const ec = initChart();
        if (!snapshots.length) return;

        ec.setOption(
          {
            animationDuration: transitionDuration,
            animationDurationUpdate: transitionDuration,
            legend: {
              show: false,
              data: sortedNames,
              selected: sortedNames.reduce((acc, name) => {
                acc[name] = isSeriesVisible(name);
                return acc;
              }, {}),
            },
            tooltip: {
              trigger: "item",
              appendToBody: true,
              confine: true,
              formatter: (params) => {
                const label = formattedDates[params.dataIndex] || "";
                return `<b>${params.seriesName}</b><br>${label}: ${params.value}º`;
              },
            },
            grid: {
              left: 52,
              right: 150,
              top: 24,
              bottom: 34,
              containLabel: false,
            },
            xAxis: {
              type: "category",
              data: formattedDates,
              boundaryGap: false,
              axisLabel: { fontSize: 10, color: "#9ca3af" },
              axisLine: { lineStyle: { color: "#e5e7eb" } },
              splitLine: { show: true, lineStyle: { color: "#f3f4f6" } },
            },
            yAxis: {
              type: "value",
              inverse: true,
              min: 1,
              max: getPositionAxisMax(),
              interval: 1,
              axisLabel: {
                formatter: "{value}º",
                fontSize: 10,
                color: "#9ca3af",
              },
              splitLine: { lineStyle: { color: "#f3f4f6" } },
            },
            series: sortedNames.map((name) => ({
              name,
              type: "line",
              smooth: true,
              clip: false,
              symbol: "circle",
              symbolSize: 8,
              lineStyle: { width: 2, color: colorMap[name] },
              itemStyle: {
                color: colorMap[name],
                borderColor: "#fff",
                borderWidth: 2,
              },
              emphasis: {
                focus: "series",
                lineStyle: { width: 4 },
              },
              endLabel: {
                show: true,
                formatter: "{a}",
                color: colorMap[name],
                fontSize: 10,
                fontWeight: 700,
                distance: 8,
              },
              labelLayout: { moveOverlap: "shiftY" },
              data: snapshots.map(
                (snapshot) => snapshot.posMap[name] || participantsData.length,
              ),
            })),
          },
          false,
          true,
        );
      }

      function renderPointsLeaderChart() {
        const ec = initChart();
        if (!snapshots.length) return;

        const gameLabels = ["Início"].concat(formattedDates);
        const refName = getSelectedReferenceName();
        const referenceLabel = referencePlayer && sortedNames.includes(referencePlayer) ? referencePlayer : "líder do dia";

        function getSeriesValue(snapshot, name) {
          const referenceValue = refName ? (snapshot.ptsMap[refName] || 0) : (snapshot.leader || 0);
          return (snapshot.ptsMap[name] || 0) - referenceValue;
        }

        const relativeRange = getRelativeAxisRange(refName);

        ec.setOption(
          {
            animationDuration: transitionDuration,
            animationDurationUpdate: transitionDuration,
            legend: {
              show: false,
              data: sortedNames,
              selected: sortedNames.reduce((acc, name) => {
                acc[name] = isSeriesVisible(name);
                return acc;
              }, {}),
            },
            tooltip: {
              trigger: "axis",
              order: "valueDesc",
              appendToBody: true,
              confine: true,
              backgroundColor: "rgba(17, 24, 39, 0.84)",
              borderWidth: 0,
              textStyle: { color: "#fff" },
              formatter: (params) => {
                const snapshot = snapshots[params[0].dataIndex - 1];
                const lines = [`<b>${gameLabels[params[0].dataIndex]}</b>`];

                if (snapshot) {
                  lines.push(`Referência: <b>${refName || "líder do dia"}</b>`);
                }

                params
                  .slice()
                  .sort((a, b) => b.value - a.value)
                  .forEach((item) => {
                    lines.push(
                      `<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${item.color};margin-right:4px"></span>` +
                        `${item.seriesName}: <b>${item.value} pts da referência</b>`,
                    );
                  });

                return lines.join("<br>");
              },
            },
            grid: {
              left: 52,
              right: 150,
              top: 24,
              bottom: 34,
              containLabel: true,
            },
            xAxis: {
              type: "category",
              boundaryGap: false,
              data: gameLabels,
              axisLabel: { fontSize: 10, color: "#9ca3af" },
              splitLine: { show: true, lineStyle: { color: "#f3f4f6" } },
            },
            yAxis: {
              type: "value",
              min: Math.min(0, relativeRange.min),
              max: Math.max(0, relativeRange.max),
              name: `Diferença para ${referenceLabel}`,
              nameLocation: "middle",
              nameGap: 48,
              axisLabel: { fontSize: 10, color: "#9ca3af" },
              splitLine: { lineStyle: { color: "#f3f4f6" } },
            },
            series: sortedNames.map((name) => ({
              name,
              type: "line",
              showSymbol: false,
              smooth: false,
              clip: false,
              lineStyle: { width: 2, color: colorMap[name] },
              endLabel: {
                show: true,
                formatter: "{a}",
                color: colorMap[name],
                fontSize: 10,
                fontWeight: 700,
              },
              labelLayout: { moveOverlap: "shiftY" },
              emphasis: { focus: "series" },
              encode: { x: 0, y: 1 },
              data: [0].concat(
                snapshots.map((snapshot) => getSeriesValue(snapshot, name)),
              ),
            })),
          },
          false,
          true,
        );
      }

      function renderRaceChart(sorted) {
        destroyChart();
        if (!snapshots.length) return;
        resizeChartForParticipants(true);
        sorted = Array.isArray(sorted) && sorted.length ? sorted : sortedNames;
        raceCurrentSorted = sorted;
        // Default: show last frame (current standings)
        var lastIdx = snapshots.length - 1;
        raceFrameIdx = lastIdx;
        var scrubber = document.getElementById("race-scrubber");
        if (scrubber) {
          scrubber.max = lastIdx;
          scrubber.value = lastIdx;
        }
        updateRaceLabel(lastIdx);
        var racePlayBtn = document.getElementById("race-play-btn");
        if (racePlayBtn) {
          racePlayBtn.innerHTML = "&#9654;";
        }

        var snapLast = snapshots[lastIdx];

        var ec = initChart();
        ec.setOption({
          grid: { top: 10, bottom: 30, left: 10, right: 50, containLabel: true },
          xAxis: {
            min: 0,
            max: "dataMax",
            scale: false,
            axisLabel: {
              color: "#9ca3af",
              fontSize: 10,
              formatter: function (v) {
                return Math.round(v);
              },
            },
            splitLine: { lineStyle: { color: "#f3f4f6" } },
          },
          yAxis: {
            type: "category",
            data: raceCurrentSorted,
            inverse: true,
            animationDuration: raceAxisAnimationDuration,
            animationDurationUpdate: raceAxisAnimationDuration,
            axisLabel: {
              fontSize: 12,
              color: "#374151",
              fontWeight: 600,
              width: 140,
              overflow: "truncate",
              interval: 0,
            },
          },
          series: [
            {
              realtimeSort: true,
              type: "bar",
              barMaxWidth: 34,
              data: raceCurrentSorted.map(function (name) {
                return {
                  value: snapLast.ptsMap[name] || 0,
                  itemStyle: { color: colorMap[name] },
                };
              }),
              label: {
                show: true,
                position: "right",
                color: "#374151",
                fontSize: 12,
                fontWeight: 700,
                valueAnimation: true,
                formatter: function (p) {
                  return p.value;
                },
              },
            },
          ],
          animationDuration: 0,
          animationDurationUpdate: raceUpdateFrequency,
          animationEasing: "linear",
          animationEasingUpdate: "linear",
        });

        updateRaceLabel(currentIndex);
      }

      function updateRaceFrame(index) {
        if (!chart) return;

        const snapshot = snapshots[index];
        if (!snapshot) return;

        chart.setOption({
          series: [
            {
              data: raceCurrentSorted.map((name) => ({
                value: snapshot.ptsMap[name] || 0,
                itemStyle: { color: colorMap[name] },
              })),
            },
          ],
        });
      }

      function updateRaceLabel(index) {
        dateDisplay.textContent = formattedDates[index] || "Aguardando...";

        if (snapshots[index]) {
          currentIndex = index;
        }
      }

      function stopRace() {
        clearTimeout(timer);
        timer = null;
        playBtn.textContent = "Play";
      }

      function startTimer() {
        if (timer) return;

        const advanceDay = () => {
          if (!timer) return;

          currentIndex += 1;
          if (currentIndex >= snapshots.length) {
            stopRace();
            return;
          }

          updateRaceFrame(currentIndex);
          updateRaceLabel(currentIndex);
          timer = setTimeout(advanceDay, raceUpdateFrequency);
        };

        timer = setTimeout(advanceDay, 0);
      }

      function play() {
        if (currentIndex >= snapshots.length - 1) {
          currentIndex = 0;
          chart.setOption({
            animationDurationUpdate: 0,
            yAxis: {
              animationDuration: 0,
              animationDurationUpdate: 0,
            },
          });
          updateRaceFrame(currentIndex);
          updateRaceLabel(currentIndex);

          setTimeout(() => {
            chart.setOption({
              animationDurationUpdate: raceUpdateFrequency,
              yAxis: {
                animationDuration: raceAxisAnimationDuration,
                animationDurationUpdate: raceAxisAnimationDuration,
              },
            });
            startTimer();
          }, 100);
        } else {
          startTimer();
        }

        playBtn.textContent = "Pause";
      }

      function setChartMeta(type) {
        const referenceLabel = referencePlayer && sortedNames.includes(referencePlayer) ? referencePlayer : "líder do dia";
        const meta = {
          positions: {
            title: "Histórico de posições",
            subtitle:
              "Linha temporal da colocação de cada participante ao longo dos dias.",
          },
          "points-leader": {
            title: `Pontuação relativa ao ${referenceLabel}`,
            subtitle:
              "Cada linha mostra a diferença para o líder de cada dia por padrão, com opção de escolher um apostador no seletor.",
          },
          race: {
            title: "Gráfico de barras",
            subtitle: "Bar race com a pontuação acumulada em cada dia.",
          },
        };

        chartTitle.textContent = meta[type].title;
        chartSubtitle.textContent = meta[type].subtitle;
      }

      function setChartType(type) {
        chartType = type;
        chartButtons.forEach((button) => {
          button.classList.toggle("active", button.dataset.type === type);
        });

        setChartMeta(type);
        stopRace();

        if (type === "race") {
          raceControls.classList.remove("hidden");
        } else {
          raceControls.classList.add("hidden");
        }

        updateReferenceUI();

        renderChart();
      }

      function renderChart() {
        destroyChart();

        if (!snapshots.length) return;

        syncLegend();

        if (chartType === "race") {
          renderRaceChart();
          return;
        }

        resizeChartForParticipants(false);

        if (chartType === "positions") {
          renderPositionsChart();
        } else if (chartType === "points-leader") {
          renderPointsLeaderChart();
        }
      }

      chartButtons.forEach((button) => {
        button.addEventListener("click", () =>
          setChartType(button.dataset.type),
        );
      });

      if (referencePickerBtn) {
        referencePickerBtn.addEventListener("click", (event) => {
          event.stopPropagation();
          if (!referenceMenu) return;
          const shouldOpen = !referenceMenu.classList.contains("open");
          referenceMenu.classList.toggle("open");
          if (shouldOpen && referenceFilter) {
            setTimeout(() => {
              referenceFilter.focus();
              referenceFilter.select();
            }, 0);
          }
        });
      }

      if (referenceMenu) {
        referenceMenu.addEventListener("click", (event) => {
          event.stopPropagation();
        });
      }

      if (referenceFilter) {
        referenceFilter.addEventListener("input", () => {
          referenceFilterText = referenceFilter.value || "";
          if (chartType === "points-leader") {
            syncReferenceOptions();
          }
        });
      }

      document.addEventListener("click", () => {
        if (referenceMenu) referenceMenu.classList.remove("open");
      });

      playBtn.addEventListener("click", () => {
        if (timer) {
          stopRace();
        } else {
          play();
        }
      });

      async function init() {
        try {
          const response = await fetch("pontuacao-por-dia-grupo-3484.csv");
          if (!response.ok) {
            throw new Error(`Falha ao carregar CSV (${response.status}).`);
          }

          const csvText = await response.text();
          parseCsvData(csvText);

          if (!participantsData.length || !formattedDates.length) {
            throw new Error("CSV sem dados válidos para exibição.");
          }

          setChartType("positions");

          window.addEventListener("resize", () => {
            if (chart) {
              chart.resize();
            }
          });
        } catch (error) {
          chartSubtitle.textContent = "Erro ao carregar o CSV de pontuação.";
          dateDisplay.textContent = "Erro ao carregar CSV";
          playBtn.disabled = true;
          playBtn.textContent = "Indisponível";
          console.error(error);
        }
      }

      init();
    </script>
  </body>
</html>
